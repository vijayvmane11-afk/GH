<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GirlHacks Mentor - Scan to Open</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #202044;
      background: linear-gradient(135deg, #6c4ce8, #4a83f7);
    }
    .card {
      background: #fff;
      padding: 40px 48px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 24px 70px rgba(33, 23, 99, 0.3);
    }
    h1 { margin: 0 0 4px; font-size: 28px; }
    p { margin: 0 0 24px; color: #77779a; }
    #qrcode { display: inline-block; padding: 16px; background: #fff; border: 4px solid #6c4ce8; border-radius: 16px; }
    #qrcode img { display: block; }
    a { display: block; margin-top: 20px; color: #6c4ce8; font-weight: 600; text-decoration: none; word-break: break-all; }
    button { margin-top: 24px; padding: 10px 24px; color: #fff; font-size: 15px; font-weight: 600; background: #6c4ce8; border: 0; border-radius: 10px; cursor: pointer; }
    button:hover { background: #4c31b8; }
    @media print { body { background: #fff; } .card { box-shadow: none; } button { display: none; } }
  </style>
</head>
<body>
  <div class="card">
    <h1>GirlHacks Mentor</h1>
    <p>Scan to open on your phone</p>
    <div id="qrcode"></div>
    <a id="link" href="https://vijayvmane11-afk.github.io/GH/">https://vijayvmane11-afk.github.io/GH/</a>
    <button onclick="window.print()">Print</button>
  </div>
  <script>
    const url = "https://vijayvmane11-afk.github.io/GH/";
    new QRCode(document.getElementById("qrcode"), {
      text: url,
      width: 280,
      height: 280,
      colorDark: "#202044",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
